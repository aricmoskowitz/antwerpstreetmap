<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECD8;
    --paper-2:#EBDFC0;
    --ink:#2C2A1E;
    --green:#3F5A3D;
    --gold:#B8952E;
    --copper:#A15C2C;
    --hairline:#D9CBA3;
    --card:#FBF6E8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);}
  body{
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  #app{max-width:460px; margin:0 auto; padding:14px 16px calc(28px + env(safe-area-inset-bottom)); min-height:100vh;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; min-height:44px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; flex:none;}
  .brand h1{font-size:1.15rem; margin:0; font-weight:600; letter-spacing:.2px;}
  .brand .sub{font-size:.72rem; color:var(--copper); font-style:italic; margin-top:-2px;}
  .icon-btn{
    appearance:none; border:1px solid var(--hairline); background:var(--card); color:var(--ink);
    font-family:'Work Sans'; font-size:.85rem; border-radius:2px 12px 2px 12px;
    min-width:44px; min-height:44px; padding:0 14px; display:flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--paper-2);}

  .folio{
    text-align:center; font-family:'Fraunces', serif; font-style:italic; color:var(--copper);
    font-size:.8rem; letter-spacing:.5px; margin:2px 0 16px;
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card); border:1px solid var(--hairline);
    border-radius:2px 16px 2px 16px; padding:16px 18px; margin-bottom:14px;
  }
  .card h2{font-size:1.05rem; margin:0 0 6px;}
  .card p{margin:0 0 8px; line-height:1.5; font-size:.92rem;}
  .card p:last-child{margin-bottom:0;}
  .muted{color:#5c5842; font-size:.85rem;}

  /* ---------- home / path screen ---------- */
  .module-row{display:flex; margin-bottom:11px; min-height:56px;}
  .module-tab{
    flex:none; width:38px; display:flex; align-items:center; justify-content:center;
    border-radius:4px 0 0 4px; font-family:'Fraunces'; font-weight:600; font-size:1.05rem;
    background:var(--hairline); color:var(--ink); border:1px solid var(--hairline); border-right:none;
  }
  .module-row.unlocked .module-tab{background:var(--green); color:var(--paper); border-color:var(--green);}
  .module-row.complete .module-tab{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .module-card{
    flex:1; background:var(--card); border:1px solid var(--hairline);
    border-radius:0 16px 2px 16px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; min-height:56px;
  }
  .module-row.locked .module-card{cursor:default; opacity:.62;}
  .module-card:active{background:var(--paper-2);}
  .module-info h3{margin:0 0 2px; font-size:.98rem;}
  .module-info .m-sub{font-size:.78rem; color:#5c5842;}
  .module-status{font-size:.78rem; text-align:right; white-space:nowrap; flex:none; font-family:'Work Sans'; color:var(--copper); font-weight:600;}
  .module-status.locked-tag{color:#8a836a;}

  .reset-row{text-align:center; margin-top:22px;}
  .link-btn{
    background:none; border:none; color:var(--copper); font-family:'Work Sans'; font-size:.85rem;
    text-decoration:underline; cursor:pointer; padding:10px; min-height:44px;
  }

  /* ---------- map ---------- */
  .map-wrap{
    background:var(--paper-2); border:1px solid var(--hairline); border-radius:2px 18px 2px 18px;
    padding:8px; margin-bottom:14px; position:relative;
  }
  .map-wrap svg{display:block; width:100%; height:auto; touch-action:manipulation;}
  .street{fill:none; stroke:var(--ink); opacity:.8;}
  .street.hidden-mod{display:none;}
  .street.target{stroke:var(--copper); opacity:1;}
  .street.answered-correct{stroke:var(--green); opacity:1;}
  .street.answered-wrong{stroke:var(--copper); opacity:1; stroke-dasharray:3 3;}
  .hitpath{fill:none; stroke:transparent; stroke-linecap:round; cursor:pointer;}
  .hit-circle{fill:transparent; cursor:pointer;}
  .landmark{opacity:.85;}
  .landmark.hidden-mod{display:none;}
  .landmark .glyph-stroke{stroke:var(--ink); fill:none;}
  .landmark.target .glyph-stroke{stroke:var(--copper);}
  .landmark.answered-correct .glyph-stroke{stroke:var(--green);}
  .landmark.answered-wrong .glyph-stroke{stroke:var(--copper); stroke-dasharray:2 2;}
  .plaza-fill{fill:var(--paper);}
  .label{
    font-family:'Work Sans'; font-size:11px; fill:var(--ink); opacity:0; pointer-events:none;
    paint-order:stroke; stroke:var(--paper); stroke-width:3px;
  }
  .label.show{opacity:1;}
  .water{fill:url(#waterHatch); stroke:var(--ink); stroke-width:1.4; opacity:.75;}
  .map-caption{font-family:'Fraunces'; font-style:italic; font-size:.72rem; fill:var(--copper); opacity:.8;}
  .flash-toast{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:.78rem; padding:8px 14px; border-radius:2px 10px 2px 10px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .flash-toast.show{opacity:.94;}

  /* ---------- controls ---------- */
  .btn-row{display:flex; gap:10px; margin-top:4px;}
  .btn{
    flex:1; appearance:none; border:none; font-family:'Work Sans'; font-weight:600; font-size:.92rem;
    padding:13px 14px; border-radius:2px 14px 2px 14px; cursor:pointer; min-height:46px;
  }
  .btn-primary{background:var(--green); color:var(--paper);}
  .btn-primary:active{background:#334a31;}
  .btn-secondary{background:var(--card); color:var(--ink); border:1px solid var(--hairline);}
  .btn-secondary:active{background:var(--paper-2);}
  .btn:disabled{opacity:.45; cursor:default;}

  .feedback{border-left:4px solid var(--green);}
  .feedback.wrong{border-left:4px solid var(--copper);}
  .feedback .tag{font-family:'Fraunces'; font-style:italic; font-weight:600; font-size:.85rem; display:block; margin-bottom:4px;}
  .feedback.correct .tag{color:var(--green);}
  .feedback.wrong .tag{color:var(--copper);}

  .score-big{font-family:'Fraunces'; font-size:2.4rem; text-align:center; margin:6px 0 2px; font-weight:600;}
  .score-sub{text-align:center; font-size:.85rem; color:#5c5842; margin-bottom:10px;}

  /* chips for free recall */
  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    font-family:'Work Sans'; font-size:.82rem; padding:9px 12px; border-radius:2px 10px 2px 10px;
    background:var(--card); border:1px solid var(--hairline); cursor:pointer; min-height:38px; display:flex; align-items:center;
  }
  .chip.selected{background:var(--green); color:var(--paper); border-color:var(--green);}
  .chip.done-correct{background:var(--paper-2); color:#7a765f; border-style:dashed; text-decoration:line-through; cursor:default;}
  .chip.done-wrong{background:var(--paper-2); color:#7a765f; border-style:dashed; text-decoration:line-through; cursor:default;}

  .missed-list{margin-top:6px;}
  .missed-item{padding:10px 0; border-bottom:1px solid var(--hairline);}
  .missed-item:last-child{border-bottom:none;}
  .missed-item .mi-name{font-family:'Fraunces'; font-weight:600; font-size:.94rem;}
  .missed-item p{margin:3px 0 0; font-size:.85rem;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(44,42,30,.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:20;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal-card{background:var(--card); border-radius:2px 16px 2px 16px; padding:20px; max-width:340px; width:100%; border:1px solid var(--hairline);}
  .modal-card h3{margin:0 0 8px;}
  .modal-card p{margin:0 0 16px; font-size:.9rem; line-height:1.5;}

  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-backdrop" id="resetModal" hidden>
  <div class="modal-card">
    <h3>Reset all progress?</h3>
    <p>This clears every module score and sends you back to the start. This can't be undone.</p>
    <div class="btn-row">
      <button class="btn btn-secondary" id="resetCancel">Cancel</button>
      <button class="btn btn-primary" id="resetConfirm">Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== DATA ============================== */

var MODULES = [
  {id:1, title:"Orientation", sub:"The five anchors", items:["river-bend","grote-markt","cathedral","centraal-station","mas"]},
  {id:2, title:"Historic Core", sub:"Around the cathedral", items:["meir","nationalestraat","huidevettersstraat","kammenstraat","groenplaats"]},
  {id:3, title:"The Leien Ring", sub:"Where the walls used to stand", items:["italielei","frankrijklei","britselei","amerikalei"],
    intro:"Until the mid-1800s, Antwerp was still boxed in by the 16th-century Spanish city walls and the moat around them — a fortification ring built when the city was a fought-over Habsburg stronghold. As the port grew through the 19th century and the walls became militarily useless and physically limiting, the city tore them down (starting in 1859) and replaced the whole ring with a chain of wide boulevards on the reclaimed land: ‘de Leien.’ Rather than one continuous name, the ring was split into stretches, each christened after a nation with strong ties to Antwerp’s booming international trade — Amerikalei for the United States, Italiëlei for Italy, Britselei for Britain, Frankrijklei for France, and others further around the ring. Walking the Leien is walking the footprint of the old walls — and reading the street signs is reading a list of 19th-century Antwerp’s best trading partners."},

/* ============================== STATE ============================== */

function defaultState(){
  return { progress:{}, session:{screen:"home"} };
}
var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    return { progress: parsed.progress || d.progress, session: parsed.session || d.session };
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function resetState(){
  state = defaultState();
  saveState();
  render();
}

function moduleById(id){ for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id===id) return MODULES[i]; } return null; }
function isUnlocked(modId){
  if(modId===1) return true;
  var prev = state.progress[modId-1];
  return !!(prev && prev.completed);
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function pathItem(id, d, w, hitScale){
  var it = ITEMS[id];
  return '<path class="street" data-id="'+id+'" d="'+d+'" stroke-width="'+w+'"/>' +
         '<path class="hitpath" data-id="'+id+'" d="'+d+'" stroke-width="20"/>' +
         labelFor(id, midOfPath(d));
}
function midOfPath(d){
  var nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  var x0=nums[0], y0=nums[1], x1=nums[nums.length-2], y1=nums[nums.length-1];
  return {x:(x0+x1)/2, y:(y0+y1)/2 - 6};
}
function labelFor(id, pos){
  var it = ITEMS[id];
  var anchor = "middle", x = pos.x;
  if(x < 65){ anchor = "start"; x = x + 14; }
  else if(x > 335){ anchor = "end"; x = x - 14; }
  return '<text class="label" data-label="'+id+'" x="'+x+'" y="'+pos.y+'" text-anchor="'+anchor+'">'+it.name+'</text>';
}
function landmarkWrap(id, x, y, inner){
  return '<g class="landmark" data-lm="'+id+'" transform="translate('+x+','+y+')">' + inner +
    '<circle class="hit-circle" data-id="'+id+'" r="20"/>' +
    '</g>' + labelFor(id, {x:x, y:y+30});
}

function overallFolio(){

  return '<div class="folio">— '+done+' of 6 districts mapped —</div>';

function pct(n){ return Math.round(n*100)+"%"; }

/* ---------- HOME SCREEN ---------- */

function renderHome(){
  var html = brandHeader() + overallFolio();
  MODULES.forEach(function(m){
    var unlocked = isUnlocked(m.id);
    var prog = state.progress[m.id];
    var complete = !!(prog && prog.completed);
    var rowClass = "module-row " + (complete ? "complete" : (unlocked ? "unlocked" : "locked"));
    var status;
    if(!unlocked){ status = '<span class="module-status locked-tag">locked</span>'; }
    else if(complete){ status = '<span class="module-status">'+pct(prog.bestScore)+' best</span>'; }
    else if(prog && prog.attempts){ status = '<span class="module-status">'+pct(prog.bestScore)+' · retry</span>'; }
    else { status = '<span class="module-status">start →</span>'; }
    html += '<div class="'+rowClass+'">' +
      '<div class="module-tab">'+(complete? "✓" : m.id)+'</div>' +
      '<div class="module-card" data-open-module="'+m.id+'" role="button" tabindex="0">' +
        '<div class="module-info"><h3>'+m.title+'</h3><div class="m-sub">'+m.sub+'</div></div>' +
        status +
      '</div>' +
    '</div>';
  });
  html += '<div class="reset-row"><button class="link-btn" id="resetBtn">Reset all progress</button></div>';
  appEl.innerHTML = html;

  appEl.querySelectorAll("[data-open-module]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = parseInt(el.getAttribute("data-open-module"), 10);
      if(!isUnlocked(id)) return;
      openModule(id);
    });
  });
  document.getElementById("resetBtn").addEventListener("click", function(){
    document.getElementById("resetModal").hidden = false;
  });
}

function openModule(id){
  var m = moduleById(id);
  if(m.freeRecall){
    state.session = { screen:"module", moduleId:id, step:"freerecall",
      remaining: shuffle(m.items.slice()), attempted: [], selectedId:null };
  } else {
    state.session = { screen:"module", moduleId:id, step:"intro" };
  }
  saveState();
  render();
}

function moduleHeader(m, right){

function bindBackHome(){
  var b = document.getElementById("backHome");
  if(b) b.addEventListener("click", function(){ state.session = {screen:"home"}; saveState(); render(); });
}

function renderMapInto(container, opts){
  opts = opts || {};
  container.innerHTML = mapSVG();
  var svg = container.querySelector("svg");
  var contextMax = opts.contextMax != null ? opts.contextMax : 6;
  Object.keys(ITEMS).forEach(function(id){
    var mod = itemModule(id);
    var visible = mod <= contextMax;
    svg.querySelectorAll('[data-id="'+id+'"]').forEach(function(el){
      if(!visible) el.classList.add("hidden-mod");
    });
    var lm = svg.querySelector('.landmark[data-lm="'+id+'"]');
    if(lm && !visible) lm.classList.add("hidden-mod");
  });
  return svg;
}
function itemModule(id){
  for(var i=0;i<6;i++){ if(MODULES[i].items.indexOf(id) !== -1) return MODULES[i].id; }
  return 99;
}

function setLabelShown(svg, id, shown){
  var lab = svg.querySelector('[data-label="'+id+'"]');
  if(lab) lab.classList.toggle("show", shown);
}
function setTargetClass(svg, id, cls){
  svg.querySelectorAll('[data-id="'+id+'"]').forEach(function(el){
    el.classList.remove("target","answered-correct","answered-wrong");
    if(cls) el.classList.add(cls);
  });
  var lm = svg.querySelector('.landmark[data-lm="'+id+'"]');
  if(lm){ lm.classList.remove("target","answered-correct","answered-wrong"); if(cls) lm.classList.add(cls); }
}

      '<h2>'+it.name+'</h2>' +
      '<p>'+it.why+'</p>' +
      '<div class="btn-row">' +
        (idx>0 ? '<button class="btn btn-secondary" id="learnPrev">← Back</button>' : '') +
        '<button class="btn btn-primary" id="learnNext">'+(isLast ? "Start Practice" : "Next →")+'</button>' +
      '</div>' +
    '</div>';
  appEl.innerHTML = html;

  var svg = renderMapInto(document.getElementById("mapWrap"), {contextMax: m.id});
  setTargetClass(svg, id, "target");
  setLabelShown(svg, id, true);

  bindBackHome();
  var prevBtn = document.getElementById("learnPrev");
  if(prevBtn) prevBtn.addEventListener("click", function(){
    state.session.learnIndex = idx - 1; saveState(); render();
  });
  document.getElementById("learnNext").addEventListener("click", function(){
    if(isLast){
      state.session.step = "quiz";
      state.session.queue = shuffle(m.items.slice());
      state.session.qIndex = 0;
      state.session.results = [];
      state.session.answeredThis = false;
    } else {
      state.session.learnIndex = idx + 1;
    }
    saveState(); render();
  });
}

/* ---------- QUIZ STEP ---------- */

function renderQuiz(m){
  var s = state.session;
  var id = s.queue[s.qIndex];
  var it = ITEMS[id];
  var answered = s.answeredThis;
  var lastCorrect = s.lastCorrect;
  var lastTappedId = s.lastTappedId;

  var html = moduleHeader(m) +
    '<div class="map-wrap" id="mapWrap"><div class="flash-toast" id="toast"></div></div>' +
    '<div class="folio" style="margin-top:-8px;">question '+(s.qIndex+1)+' of '+s.queue.length+'</div>';

  if(!answered){
    html += '<div class="card"><h2>Tap on the map:</h2><p style="font-family:Fraunces; font-style:italic; font-size:1.15rem;">'+it.name+'</p></div>';
  } else {
    var tappedName = lastTappedId ? ITEMS[lastTappedId].name : null;
    html += '<div class="card feedback '+(lastCorrect?"correct":"wrong")+'">' +
      '<span class="tag">'+(lastCorrect ? "Correct" : (tappedName ? "Not quite — that’s "+tappedName : "Not quite"))+'</span>' +
      '<h2>'+it.name+'</h2>' +
      '<p>'+it.why+'</p>' +
      '<div class="btn-row"><button class="btn btn-primary" id="quizNext">'+(s.qIndex+1<s.queue.length ? "Continue →" : "See Results")+'</button></div>' +
    '</div>';
  }

  appEl.innerHTML = html;
  var svg = renderMapInto(document.getElementById("mapWrap"), {contextMax: m.id});
  bindBackHome();

  if(answered){
    setTargetClass(svg, id, lastCorrect ? "answered-correct" : "target");
    setLabelShown(svg, id, true);
    if(!lastCorrect && lastTappedId && lastTappedId !== id){
      setTargetClass(svg, lastTappedId, "answered-wrong");
      setLabelShown(svg, lastTappedId, true);
    }
    document.getElementById("quizNext").addEventListener("click", function(){
      if(s.qIndex+1 < s.queue.length){
        s.qIndex += 1; s.answeredThis = false; s.lastTappedId = null;
      } else {
        finishQuiz(m);
        return;
      }
      saveState(); render();
    });
  } else {
    svg.addEventListener("click", function(e){
      var target = e.target.closest("[data-id]");
      if(!target) return;
      var tappedId = target.getAttribute("data-id");
      var correct = tappedId === id;
      s.results.push({id:id, correct:correct});
      s.answeredThis = true;
      s.lastCorrect = correct;
      s.lastTappedId = tappedId;
      saveState(); render();
    });
  }
}

function finishQuiz(m){
  var s = state.session;
  var correctCount = s.results.filter(function(r){return r.correct;}).length;
  var score = correctCount / s.results.length;
  var prog = state.progress[m.id] || {attempts:0, bestScore:0, completed:false};
  prog.attempts += 1;
  prog.bestScore = Math.max(prog.bestScore, score);
  if(score >= PASS_THRESHOLD) prog.completed = true;
  state.progress[m.id] = prog;
  state.session.step = "result";
  state.session.lastScore = score;
  saveState(); render();
}

/* ---------- RESULT STEP ---------- */

function renderResult(m){
  var s = state.session;
  var score = s.lastScore;
  var passed = score >= PASS_THRESHOLD;
  var wrongIds = s.results.filter(function(r){return !r.correct;}).map(function(r){return r.id;});

  var html = moduleHeader(m) +
    '<div class="card">' +
      '<div class="score-big">'+pct(score)+'</div>' +
      '<div class="score-sub">'+(passed ? "Checkpoint passed" : "Below the "+pct(PASS_THRESHOLD)+" checkpoint")+'</div>';

  if(wrongIds.length){
    html += '<div class="missed-list">';
    wrongIds.forEach(function(id){
      html += '<div class="missed-item"><div class="mi-name">'+ITEMS[id].name+'</div><p>'+ITEMS[id].why+'</p></div>';
    });
    html += '</div>';
  }

  var nextM = moduleById(m.id+1);
  html += '<div class="btn-row">' +
    '<button class="btn btn-secondary" id="retryModule">Try Again</button>' +
    (passed && nextM ? '<button class="btn btn-primary" id="nextModule">Next: '+nextM.title+'</button>' : '<button class="btn btn-primary" id="toHome">Back to Path</button>') +
  '</div></div>';

  appEl.innerHTML = html;
  bindBackHome();
  document.getElementById("retryModule").addEventListener("click", function(){
    state.session.step = "quiz";
    state.session.queue = shuffle(m.items.slice());
    state.session.qIndex = 0; state.session.results = []; state.session.answeredThis = false;
    saveState(); render();
  });
  var nb = document.getElementById("nextModule");
  if(nb) nb.addEventListener("click", function(){ openModule(m.id+1); });
  var th = document.getElementById("toHome");
  if(th) th.addEventListener("click", function(){ state.session = {screen:"home"}; saveState(); render(); });
}

/* ---------- FREE RECALL ---------- */

function renderFreeRecall(m){
  var s = state.session;
  var total = m.items.length;
  var attempted = s.attempted.length;
  var correctSoFar = s.attempted.filter(function(a){return a.correct;}).length;

  var html = moduleHeader(m) +
    '<div class="map-wrap" id="mapWrap"><div class="flash-toast" id="toast"></div></div>' +
    '<div class="folio" style="margin-top:-8px;">'+attempted+' of '+total+' attempted · '+correctSoFar+' correct</div>' +
    '<div class="card">' +
      '<h2>Pick a street you remember, then tap it on the map.</h2>' +
      '<div class="chip-wrap" id="chipWrap"></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="finishRecall">Finish</button></div>' +
    '</div>';
  appEl.innerHTML = html;

  var svg = renderMapInto(document.getElementById("mapWrap"), {contextMax:6});
  bindBackHome();

  var chipWrap = document.getElementById("chipWrap");
  var attemptedIds = {};
  s.attempted.forEach(function(a){ attemptedIds[a.id] = a.correct; });

  m.items.forEach(function(id){
    var chip = document.createElement("div");
    var doneState = attemptedIds.hasOwnProperty(id) ? (attemptedIds[id] ? "done-correct" : "done-wrong") : null;
    chip.className = "chip" + (doneState ? " "+doneState : (s.selectedId===id ? " selected" : ""));
    chip.textContent = ITEMS[id].name + (doneState === "done-correct" ? " ✓" : doneState === "done-wrong" ? " ✗" : "");
    if(!doneState){
      chip.addEventListener("click", function(){
        s.selectedId = (s.selectedId === id) ? null : id;
        saveState(); render();
      });
    }
    chipWrap.appendChild(chip);
  });

  svg.addEventListener("click", function(e){
    var target = e.target.closest("[data-id]");
    if(!target) return;
    var tappedId = target.getAttribute("data-id");
    if(!s.selectedId){
      showToast("Pick a name below first");
      return;
    }
    var correct = tappedId === s.selectedId;
    s.attempted.push({id:s.selectedId, correct:correct, tappedId:tappedId});
    setTargetClass(svg, s.selectedId, correct ? "answered-correct" : "target");
    setLabelShown(svg, s.selectedId, true);
    if(!correct && tappedId !== s.selectedId){
      setTargetClass(svg, tappedId, "answered-wrong");
    }
    showToast(correct ? "Correct — "+ITEMS[s.selectedId].name : "That was "+(ITEMS[tappedId]?ITEMS[tappedId].name:"somewhere else"));
    s.selectedId = null;
    saveState();
    setTimeout(render, 550);
  });

  document.getElementById("finishRecall").addEventListener("click", function(){ finishFreeRecall(m); });

  function showToast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1400);
  }
}

function finishFreeRecall(m){
  var s = state.session;
  var correctIds = {};
  s.attempted.forEach(function(a){ if(a.correct) correctIds[a.id] = true; });
  var score = Object.keys(correctIds).length / m.items.length;
  var prog = state.progress[7] || {attempts:0, bestScore:0, completed:false};
  prog.attempts += 1;
  prog.bestScore = Math.max(prog.bestScore, score);
  prog.completed = true;
  state.progress[7] = prog;
  state.session.step = "freerecall-result";
  state.session.lastScore = score;
  state.session.missed = m.items.filter(function(id){ return !correctIds[id]; });
  saveState(); render();
}

function renderFreeRecallResult(m){
  var s = state.session;
  var html = moduleHeader(m) +
    '<div class="card">' +
      '<div class="score-big">'+pct(s.lastScore)+'</div>' +
      '<div class="score-sub">'+(s.missed.length)+' of '+m.items.length+' still to learn</div>';

  if(s.missed.length){
    html += '<div class="missed-list">';
    s.missed.forEach(function(id){
      html += '<div class="missed-item"><div class="mi-name">'+ITEMS[id].name+'</div><p>'+ITEMS[id].why+'</p></div>';
    });
    html += '</div>';
  } else {
    html += '<p>You placed every street in Antwerp Streets from memory. That’s the whole map.</p>';
  }

  html += '<div class="btn-row">' +
    '<button class="btn btn-secondary" id="recallAgain">Practice Again</button>' +
    '<button class="btn btn-primary" id="toHome2">Back to Path</button>' +
  '</div></div>';

  appEl.innerHTML = html;
  bindBackHome();
  document.getElementById("recallAgain").addEventListener("click", function(){ openModule(7); });
  document.getElementById("toHome2").addEventListener("click", function(){ state.session = {screen:"home"}; saveState(); render(); });
}

/* ============================== ROUTER ============================== */

function render(){
  var s = state.session;
  if(s.screen === "home" || !s.screen){
    renderHome();
    return;
  }
  var m = moduleById(s.moduleId);
  if(!m){ state.session = {screen:"home"}; saveState(); renderHome(); return; }
  switch(s.step){
    case "intro": renderIntro(m); break;
    case "learn": renderLearn(m); break;
    case "quiz": renderQuiz(m); break;
    case "result": renderResult(m); break;
    case "freerecall": renderFreeRecall(m); break;
    case "freerecall-result": renderFreeRecallResult(m); break;
    default: renderIntro(m);
  }
}

document.getElementById("resetCancel").addEventListener("click", function(){
  document.getElementById("resetModal").hidden = true;
});
document.getElementById("resetConfirm").addEventListener("click", function(){
  document.getElementById("resetModal").hidden = true;
  resetState();
});

render();

})();
</script>
</body>
</html>
