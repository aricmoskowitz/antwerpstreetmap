<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Antwerp Inside the Ring</title>
<meta name="description" content="Learn the streets, squares, waterways, buildings, parks, trees and neighborhoods of Antwerp's historic core: browse street cards, take map quizzes, walk routes and explore the map.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antwerp Ring">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<section class="view" id="view-scroll" hidden></section>
<section class="view" id="view-learn" hidden>
  <div id="learn-root" data-mount></div>
  <div class="modal-backdrop" id="resetModal" hidden>
    <div class="modal-card">
      <h3>Reset all progress?</h3>
      <p>This clears every module's quiz score. This can't be undone.</p>
      <div class="modal-btn-row">
        <button class="btn btn-secondary" id="resetCancel">Cancel</button>
        <button class="btn btn-primary" id="resetConfirm">Reset</button>
      </div>
    </div>
  </div>
</section>
<section class="view" id="view-walk" hidden></section>
<section class="view" id="view-explore" hidden></section>
</div>
<nav class="tabbar" id="tabbar" aria-label="App sections"></nav>

<script src="shell.js"></script>
</body>
</html>
